      #   uses: JamesIves/github-pages-deploy-action@v4
      #   with:
      #     folder: site-build
      #     branch: gh-pages

      # OPTION 2: FTP (e.g., cPanel - requires secrets.FTP_SERVER, secrets.FTP_USERNAME, secrets.FTP_PASSWORD)
      # - name: Deploy via FTP
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
