name: Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: site-build

      # --- Choose your deployment method ---

      # OPTION 1: GitHub Pages (uncomment and configure if needed)
